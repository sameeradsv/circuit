<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Circuit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#10201f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Circuit" />

  <script>
    (function() {
      var c = document.createElement('canvas');
      c.width = 192; c.height = 192;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#10201f';
      ctx.beginPath();
      ctx.roundRect(0, 0, 192, 192, 36);
      ctx.fill();
      ctx.strokeStyle = '#86efac';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(52, 126);
      ctx.bezierCurveTo(62, 70, 122, 54, 148, 86);
      ctx.bezierCurveTo(110, 88, 82, 106, 64, 142);
      ctx.stroke();
      var link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-aurora">
  <div class="ambient-field" aria-hidden="true"></div>

  <header>
    <h1>Circuit</h1>
    <div class="header-right">
      <button type="button" class="mode-pill" id="mode-display" title="Change energy mode"></button>
    </div>
  </header>

  <main>
    <section class="dashboard" id="dashboard">
      <div class="snapshot-banner" id="snapshot-banner"></div>
      <div class="stats-grid" id="stats-grid"></div>

      <div class="workload-section">
        <div class="workload-header">
          <span>Workload</span>
          <span id="workload-label" class="workload-label"></span>
        </div>
        <div class="workload-bar" id="workload-bar"><span class="workload-fill"></span></div>
      </div>

      <details class="panel schedule-panel" open>
        <summary>Today's plan</summary>
        <ul class="schedule-list" id="schedule-list"></ul>
        <p class="schedule-explain" id="schedule-explain"></p>
      </details>

      <details class="panel forecast-panel">
        <summary>Forecast</summary>
        <div id="forecast-panel" class="forecast-body"></div>
      </details>

      <div class="insight-panel" id="insight-panel" aria-live="polite"></div>
    </section>

    <section class="mode-selector" id="mode-selector">
      <button class="mode-btn active" data-mode="normal">Normal</button>
      <button class="mode-btn" data-mode="deep">Deep work</button>
      <button class="mode-btn" data-mode="low">Low energy</button>
      <button class="mode-btn" data-mode="social">Social recovery</button>
    </section>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Capture a task, deadline, or plan" required />
      <button type="submit">Add</button>
    </form>

    <div class="tag-row" id="tag-row">
      <span class="tag-label">Tag</span>
      <button class="tag-btn active" data-tag="general">General</button>
      <button class="tag-btn" data-tag="work">Work</button>
      <button class="tag-btn" data-tag="social">Social</button>
      <button class="tag-btn" data-tag="later">Later</button>
    </div>

    <div id="import-status" class="import-status"></div>

    <details class="sync-menu">
      <summary>Sync</summary>
      <div class="sync-actions" aria-label="Import and export">
        <input type="file" id="file-input" accept=".txt" hidden />
        <input type="file" id="calendar-file-input" accept=".ics,text/calendar" hidden />
        <button type="button" class="import-btn">Import tasks</button>
        <button type="button" id="calendar-import">Import calendar</button>
        <button type="button" id="calendar-export">Export calendar</button>
        <span id="calendar-sync-status">Local file sync</span>
      </div>
    </details>

    <div class="view-row">
      <section class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="today">Today</button>
        <button data-filter="scheduled">Scheduled</button>
        <button data-filter="pending">Pending</button>
        <button data-filter="completed">Done</button>
      </section>
      <div class="view-toggle">
        <button type="button" id="view-list" class="active" title="List view">List</button>
        <button type="button" id="view-grouped" title="Group by tag">Group</button>
      </div>
    </div>

    <ul id="task-list"></ul>

    <div class="detail-overlay" id="detail-overlay" hidden>
      <div class="detail-card">
        <h2 class="detail-title" id="detail-title"></h2>
        <div class="detail-rows" id="detail-rows"></div>
        <div class="detail-actions">
          <button type="button" id="detail-save">Save changes</button>
          <button type="button" id="detail-close" class="nts-cancel">Close</button>
        </div>
      </div>
    </div>

    <div class="nts-overlay" id="nts-overlay" hidden>
      <div class="nts-card">
        <p class="nts-title">Smallest next step</p>
        <p class="nts-task-name" id="nts-task-name"></p>
        <input id="nts-input" type="text" placeholder="Open the file and do one edit" />
        <div class="nts-actions">
          <button id="nts-save">Save step</button>
          <button id="nts-cancel" class="nts-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
