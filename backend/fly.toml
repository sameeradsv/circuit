# One-time setup:
#   fly apps create circuit-api
#   fly volumes create circuit_data --region iad --size 1 -a circuit-api
#   fly deploy (from this directory)

app = "circuit-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////app/data/circuit.db"
  CORS_ORIGINS = "https://sameeradsv.github.io,http://localhost:3000,http://127.0.0.1:3000"
  AUTH_REQUIRED = "true"
  # CORTEX_AUTH_URL set via: fly secrets set CORTEX_AUTH_URL="https://cortex-auth.onrender.com" -a circuit-api

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[mounts]]
  source = "circuit_data"
  destination = "/app/data"
